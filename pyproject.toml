[project]
name = "geo-relations"
version = "0.1.0"
description = "Geometry diagram -> formal relations with a fine-tuned ViT and a coordinate verifier (MAAI 901 A2)"
requires-python = ">=3.11"  # pins verified on 3.11 locally; Colab ships its own Python
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.19.0",
    "timm==1.0.30",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "pytest==9.1.1",
    "tqdm==4.70.1",
]

[project.optional-dependencies]
wandb = ["wandb==0.30.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
