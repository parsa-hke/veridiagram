# Phase 7, lab visit (2-3 h on 4 GPUs; plan §0.2 #11 revised: LP-FT, 2 x 40k images per fine-tune).
# Priority order: if the PC is switched off, rerun the same command and finished runs are skipped.
jobs:
  - {config: configs/probe.yaml, seeds: [0, 1, 2], serial: true}   # 7.1 linear probe (seed 0 caches features)
  - {config: configs/finetune.yaml, seeds: [0]}                    # 7.2 fine-tune, real data
  - {config: configs/finetune_synth10k.yaml, seeds: [0]}           # 7.3 fine-tune, + 10k synthetic (50/50)
  - {config: configs/finetune.yaml, seeds: [1, 2]}                 # 7.2 seeds 1-2
  - {config: configs/finetune_synth10k.yaml, seeds: [1, 2]}        # 7.3 seeds 1-2
  - {config: configs/ablation_res224.yaml, seeds: [0]}             # 7.6 resolution
  - {config: configs/ablation_noaug.yaml, seeds: [0]}              # 7.7 augmentation
