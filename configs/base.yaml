# Base configuration. Every tunable in the project lives here; other configs
# override a subset via `inherit: base.yaml` (deep merge, child wins).
# Values marked "Phase N" are placeholders until that phase fixes them.

name: base            # run directory is runs/<name>_s<seed>/
mode: finetune        # probe | finetune | evaluate | scaling | selftrain
seed: 0
seeds: [0, 1, 2]      # seeds used for every reported number (plan §6.5)
device: auto          # auto -> cuda > mps > cpu
deterministic: true   # torch deterministic algorithms + cudnn deterministic

paths:
  raw: data/raw
  processed: data/processed
  splits: data/processed/splits
  cache: data/cache             # preprocessed overlay PNGs, cached features
  runs: runs
  log_csv: runs/log.csv
  figures: reports/figures
  tables: reports/tables
  gold: verifier/gold/gold.csv

data:
  train_sources: [geometry3k]          # + synthetic via data.synthetic_train_size
  val_sources: [geometry3k]
  test_sets: [geometry3k_test, pgdp5k_heldout, synth_extrap]
  unlabelled_source: pgps9k_pool       # Part B only; figures not in any val/test split
  split_seed: 0                        # figure-level re-split of Geometry3K (plan §0.2 #9)
  split_fractions: [0.7, 0.1, 0.2]     # train / val / test, stratified by has-circle
  synthetic_train_size: 0              # 0 | 1000 | 10000 | 50000 (Part A)
  max_diagrams: null                   # null = all; smoke sets 50
  max_queries_per_diagram: 60          # random cap; training keeps all positives, eval samples uniformly (plan §5.1)
  train_none_ratio: 3.0                # training: max all-negative queries per positive query, per query kind (plan §5.4)
  index_seed: 0                        # query sampling is fixed across training seeds
  max_queries_per_unit: null           # smoke only: evenly spaced subsample of each unit
  num_workers: 4
  cache_overlays: true

relations:
  tier1: [parallel, perpendicular, equal_length, on_circle, tangent, none]
  tier2: [collinear, midpoint, equal_angle, perp_bisector]
  use_tier2: true                      # Phase 2.6 decision (2026-10-10), see plan §0.2 #3
  tier2_included: [collinear]          # midpoint 83, equal_angle 87, perp_bisector 8 < 200 in the training split
  tier2_min_positives: 200

tolerances:                            # Phase 3.4 histograms, revised after gold round 1 (plan §0.2 #5)
  parallel_deg: 3.7                    # |sin θ| <= sin(parallel_deg); histogram valley was 2.56
  perpendicular_deg: 3.7               # |cos θ| <= sin(perpendicular_deg); valley was 2.03; also perp_bisector
  equal_length_rel: 0.10               # | |s1|-|s2| | / max; histogram knee was 0.0232
  on_circle_rel: 0.0794                # | |p-c|-r | / r (histogram valley, unchanged)
  tangent_rel: 0.0794                  # | d(line,c)-r | / r; no asserted tangents: = on_circle_rel
  collinear_rel: 0.0119                # d(p, line ab) / diagram_scale (Tier 2, included; unchanged)
  midpoint_rel: null                   # Tier 2, excluded (§0.2 #3)
  equal_angle_deg: null                # Tier 2, excluded (§0.2 #3)

not_to_scale:                          # Phase 3.6: an asserted relation off by more than this
  angle_deg: 10.0                      # parallel / perpendicular
  rel_length: 0.15                     # equal_length / on_circle / tangent

overlay:
  enabled: true                        # false: plan §7.8 ablation (query given as tokens instead)
  color: [0, 200, 0]                   # green: red/orange/cyan occur in 13-15% of real diagrams, green in 0% (Phase 5.3 check)
  width_px: 3
  halo_alpha: 0.35
  halo_width_px: 7
  point_radius_px: 5

input:
  long_side: 448                       # aspect preserved, padded
  pad_to_multiple: 16                  # = backbone patch size
  pad_value: 255                       # white, matches diagram background
  mean: [0.485, 0.456, 0.406]          # ImageNet statistics used by DINOv2/DINOv3; checked in Phase 6.1
  std: [0.229, 0.224, 0.225]

model:
  backbone: facebook/dinov3-vitl16-pretrain-lvd1689m   # verify on the hub in Phase 6.1
  backbone_fallback: facebook/dinov2-large
  library: transformers                # transformers | timm
  pooling: cls_mean                    # CLS concatenated with mean patch token
  query_input: overlay                 # overlay | tokens (plan §7.8: point names as token indices + cross-attention)
  grad_checkpointing: true
  head_dropout: 0.0

loss:
  type: bce
  pos_weight: census                   # per-class positive weights from the census

augment:
  enabled: true                        # relation-preserving only: no shear, no perspective
  rotation_deg: 180
  hflip: true
  vflip: true
  scale: [0.8, 1.2]
  line_thickness_jitter: true
  line_thickness_prob: 0.3             # 3x3 min filter: thickens dark lines (morphological dilation)
  gaussian_noise_std: [0.0, 0.03]
  noise_prob: 0.5
  jpeg_quality: [50, 95]
  jpeg_prob: 0.5
  contrast: [0.9, 1.1]

probe:
  lr: 1.0e-3
  weight_decay: 0.01
  epochs: 50
  batch_size: 256                      # on cached features
  early_stopping_patience: 10
  extract_batch_size: 32               # frozen feature extraction
  select_metric: val_macro_f1

finetune:
  batch_size: 16
  grad_accum_steps: 1
  head_lr: 1.0e-3
  backbone_lr: 2.0e-5
  llrd: 0.8                            # layer-wise decay from the last block downward
  weight_decay: 0.05
  epochs: 2                            # x epoch_images = 80k images per run (plan §0.2 #11, revised: LP-FT)
  epoch_images: 40000                  # images per epoch, drawn with replacement; null = one full pass
  real_fraction: 0.5                   # share of real queries per batch when the training set has synthetic ones
  warmup_epochs: 0.2
  lp_queries: 20000                    # LP-FT: fit the head on frozen features of this many training queries first
  lp_epochs: 30
  schedule: cosine
  amp: true
  amp_dtype: bfloat16
  ema_decay: 0.999
  select_metric: val_macro_f1
  init_checkpoint: null                # Part B student starts from the 7.3 checkpoint
  save_last: true                      # resumable checkpoint every epoch (Colab disconnects)
  keep_last: false                     # delete last.pt (~5 GB) once the run has finished
  save_dtype: bfloat16                 # best.pt precision (~0.6 GB for ViT-L)
  max_steps_per_epoch: null            # smoke only

eval:
  checkpoint: null
  batch_size: 32
  max_queries: {synth_extrap: 10000}   # evaluation cap per unit (evenly spaced; plan §0.2 #10)
  label_sets: [geometric, asserted]
  threshold: tune_on_val               # operating threshold per relation, tuned on val
  ece_bins: 15
  bootstrap_resamples: 1000
  ci_level: 0.95

synthetic:                             # Phase 4: python -m data.synthetic.build
  seed: 0
  canvas_px: 512
  margin_px: 40
  n_points: [4, 10]
  n_segments: [3, 8]
  n_circles: [0, 2]
  radius_px: [45, 130]
  center_label_prob: 0.7               # circle centre drawn as a labelled point
  min_separation_px: 30
  inject_rate: 0.5                     # per construction step: injected relation vs random point/segment
  jitter_px: 1.0                       # Gaussian sd on every coordinate after construction
  construction_weights:                # tangent doubled: it has ~no positives in real data
    {parallel: 1, perpendicular: 1, equal_length: 1, collinear: 1, on_circle: 1, tangent: 2}
  extrap_points: [12, 20]              # 1.5-2x the training max
  extrap_segments: [8, 16]
  pool_sizes: [1000, 10000, 50000]     # synth_train subsets: the first n of one 50k pool
  extrap_size: 1000
  unlabelled_size: 2000
  workers: 8
  render:
    line_width: [1.0, 2.0]
    font_size: [9, 13]
    label_offset_px: [4, 10]
    rotation_deg: 5                    # whole-diagram rotation, applied to the coordinates too
    dot_prob: 0.7                      # draw points as small dots
    mark_size_px: [8, 12]
    scan_noise: true
    scan_noise_prob: 0.5
    scan_noise_std: [0.01, 0.04]
    jpeg_artifacts: true
    jpeg_prob: 0.5
    jpeg_quality: [40, 90]

scaling:
  sizes: [0, 1000, 10000, 50000]

selftrain:                             # Part B (plan §7.11), experiments/selftrain.py
  filter: confidence                   # confidence | consistency | none (control: no pseudo-labels)
  tau: 0.9                             # an entry is confident when max(p, 1-p) > tau
  consistency_negatives: true          # confident negatives are facts too (rule C2). Without it the filter drops 1/150 diagrams
                                       # (teacher sample, 2026-10-13); with it 13/150, and the removed pseudo-positives have
                                       # precision 0.74 vs 0.92 kept. C2 also fires on 10.7% of the verifier's own labels (tolerances are not transitive)
  teacher_run: finetune_synth10k_s2    # best 7.3 model by val macro-F1 (0.8824; s0 0.8633, s1 0.8704)
  teacher_checkpoint: null             # explicit path instead of <runs>/<teacher_run>/checkpoints/best.pt
  rounds: 1

server:                                # website inference (web/server, WEBSITE_PLAN.md §4)
  pad: square                          # square: every query padded to long_side x long_side (answers independent of
                                       # batch neighbours; python -m web.server.parity, 2026-10-13); patch: QueryDataset's own
  batch_size: 8

logging:
  wandb: false
  wandb_project: geo-relations
  log_every_steps: 50
