# Smoke mode: 50 diagrams, 1 epoch. Overlaid on top of any config with --smoke,
# or used directly. Must pass before any full run.
inherit: base.yaml
name: smoke
data:
  max_diagrams: 50                     # per index unit (each split / source)
  num_workers: 0
  synthetic_train_size: 1000           # exercise the synthetic path (capped to 50 diagrams)
  max_queries_per_unit: 256            # gate measures completeness, not throughput
probe:
  epochs: 1
finetune:
  epochs: 1
  warmup_epochs: 0
  save_last: false                     # resume is unit-tested; ViT-L last.pt is ~5 GB
  epoch_images: null                   # one pass over the (tiny) smoke training set
  lp_queries: 64
  lp_epochs: 3
eval:
  bootstrap_resamples: 50
